# =============================================
# Running Coach Project Configuration
# =============================================

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  vector_db: "vector_db"
  cache: "data/cache"
  logs: "logs"

# Embedding & Vector Store Settings
embedding:
  model_name: "all-MiniLM-L6-v2"          # Fast & good starting model
  # Alternative strong model: "all-mpnet-base-v2"
  chunk_size: 800
  chunk_overlap: 100
  batch_size: 500
  collection_name: "running_coach_docs"

# RAG Settings
rag:
  top_k: 8
  similarity_threshold: 0.3
  hybrid_search: true                     # Combine vector + keyword search

# Strava Configuration
strava:
  client_id: ""                           # Fill from .env or here (not recommended)
  client_secret: ""                       # Fill from .env
  redirect_uri: "http://localhost:8501/callback"
  scopes:
    - activity:read_all
    - profile:read_all
  token_file: "data/cache/strava_tokens.json"   # Per-user tokens later

# Data Sources
data_sources:
  enable_strava: true
  enable_kaggle_datasets: true
  enable_pmc_papers: true

# Processing Settings
preprocessing:
  max_papers_to_process: 50000            # Start smaller, scale up
  tabular_batch_size: 100000
  min_run_distance_km: 1.0

# LLM Settings (for generation)
llm:
  provider: "groq"                        # Options: groq, openai, ollama, huggingface
  model_name: "llama-3.1-70b-versatile"  # or mixtral, gemma2, etc.
  temperature: 0.7
  max_tokens: 1024

# UI Settings
ui:
  app_title: "🏃‍♂️ Virtual Running Coach"
  default_page: "Coach Chat"
  enable_conversation_history: true
  max_history_messages: 20