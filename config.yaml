# =============================================
# Virtual Running Coach - Configuration
# =============================================

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  vector_db: "vector_db"
  cache: "data/cache"
  logs: "logs"

# Embedding & Vector Store
embedding:
  model_name: "all-MiniLM-L6-v2"
  chunk_size: 800
  chunk_overlap: 100
  batch_size: 512
  collection_name: "running_coach"

# RAG Settings
rag:
  top_k: 6
  similarity_threshold: 0.25

# Strava Configuration
strava:
  redirect_uri: "http://localhost:8501/callback"
  token_file: "data/cache/strava_tokens.json"

# Processing Settings
preprocessing:
  max_papers: 20000
  tabular_batch_size: 50000

# LLM Settings (for response generation)
llm:
  provider: "groq"                    # Change to "openai", "ollama", etc. later
  model_name: "llama-3.1-70b-versatile"
  temperature: 0.7
  max_tokens: 1024

# UI Settings
ui:
  app_title: "🏃‍♂️ Virtual Running Coach"
  enable_history: true